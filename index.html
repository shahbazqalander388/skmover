    <div id="root">
      <style>
        .initial-loader {
          position: fixed; inset: 0; z-index: 9999;
          display: flex; flex-direction: column; align-items: center; justify-content: center;
          background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #0f172a 100%);
        }
        .initial-loader-glow {
          position: absolute; inset: 0; opacity: 0.3;
          background: radial-gradient(ellipse at center, rgba(59,130,246,0.4) 0%, transparent 70%);
        }
        .initial-loader-content {
          position: relative; display: flex; flex-direction: column; align-items: center; gap: 2rem;
        }
        .initial-loader-box {
          width: 5rem; height: 5rem; border-radius: 1rem;
          background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
          box-shadow: 0 0 40px rgba(59,130,246,0.5);
          display: flex; align-items: center; justify-content: center;
          animation: truck-move 1s ease-in-out infinite alternate;
        }
        @keyframes truck-move {
          0% { transform: translateX(-10px); }
          100% { transform: translateX(10px); }
        }
        .initial-loader-text {
          font-family: system-ui, sans-serif;
          font-size: 2.25rem; font-weight: 900; color: white; margin: 0; text-align: center;
        }
        .initial-loader-text span {
          background: linear-gradient(135deg, #f97316, #fb923c);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
        }
        .initial-loader-sub {
          color: #93c5fd; font-size: 0.875rem; font-weight: 500; margin-top: 0.25rem;
          letter-spacing: 0.1em; text-transform: uppercase; text-align: center; font-family: system-ui, sans-serif;
        }
      </style>
